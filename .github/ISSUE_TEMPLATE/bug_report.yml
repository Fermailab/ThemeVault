name: Bug Report
description: Report a reproducible problem or rendering defect in ThemeVault
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Extension Version
      description: What version of ThemeVault are you running? (e.g., 1.0.0)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Mozilla Firefox
        - Microsoft Edge
        - Brave
        - Other Chromium Browser
    validations:
      required: true
  - type: input
    id: target_forum
    attributes:
      label: Target Forum or IPS Version
      description: URL of the forum or Invision Community version (e.g. IPS 4.7.16 or IC 5.0)
      placeholder: "https://example-forum.com (IPS 4.7)"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this behavior?
      value: |
        1. Open forum at '...'
        2. Activate theme '...'
        3. Navigate to topic '...'
        4. Observe behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Console Logs
      description: Attach screenshots or browser DevTools console output if applicable.
    validations:
      required: false
