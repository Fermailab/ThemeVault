name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate, Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Syntax & Manifest Validation
        run: npm test

      - name: Build Chrome & Firefox Distributions
        run: npm run build

      - name: Package Extension Archives
        run: npm run package

      - name: Verify Distribution Archives
        run: |
          test -f themevault-chrome.zip || (echo "Missing themevault-chrome.zip" && exit 1)
          test -f themevault-firefox.zip || (echo "Missing themevault-firefox.zip" && exit 1)
          echo "All distribution zip files successfully verified."

      - name: Upload Extension Bundles
        uses: actions/upload-artifact@v4
        with:
          name: themevault-extension-bundles
          path: |
            themevault-chrome.zip
            themevault-firefox.zip
          retention-days: 14
