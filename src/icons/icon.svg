<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="vaultDoorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#vaultDoorGrad)" stroke="#312e81" stroke-width="2" filter="url(#glow)"/>

  <!-- Outer Vault Ring / Dial -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#bgGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- Theme Palette Swatches (Stylized Vault Wheel Nodes) -->
  <circle cx="64" cy="22" r="5" fill="#38bdf8" />
  <circle cx="106" cy="64" r="5" fill="#a855f7" />
  <circle cx="64" cy="106" r="5" fill="#ec4899" />
  <circle cx="22" cy="64" r="5" fill="#10b981" />

  <!-- Inner Vault Door Core -->
  <circle cx="64" cy="64" r="28" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="3.5"/>

  <!-- Central 'V' / Vault Lock Crest -->
  <path d="M48 52 L64 78 L80 52" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing Center Spark -->
  <circle cx="64" cy="64" r="3.5" fill="#38bdf8"/>
</svg>
